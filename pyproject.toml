[project]
name = "openevalz-eval-stereoset"
version = "0.1.0"
description = "OpenEvalz packaging of StereoSet: Measuring stereotypical bias in pretrained language models"
license = { text = "BUSL-1.1" }
requires-python = ">=3.10"
dependencies = [
  "inspect-ai==0.3.260",
  "trusted-router-py>=0.7.0",
  "pyyaml>=6",
]

[tool.openevalz]
eval = "stereoset"
execution_class = "plain"
cost_class = "medium"
